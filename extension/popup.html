<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recipe Saver</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 500px;
            border: none;
        }

        .card {
            background: #f4f2ef;
            border: none;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .closeButton {
            position: absolute;
            top: 8px;
            right: 8px;
            border: none;
            background: transparent;
            color: #3e5a14;
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
            padding: 2px 6px;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #526534;
        }

        p {
            margin: 0;
            font-size: 13px;
            line-height: 1.45;
            color: #6f655a;
        }

        button {
            border: 1px solid #7e965a;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #526534;
            cursor: pointer;
            background: #dce9c8;
            transition: background 0.16s ease, transform 0.16s ease;
        }

        button:hover {
            background: #c8d8b0;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.7;
            cursor: progress;
        }

        .status {
            min-height: 18px;
            font-size: 13px;
            color: #52761b;
        }

        .contentPanel {
            border-top: 1px solid #e7dfd3;
            /* display: flex; */
            flex-direction: column;
            gap: 8px;
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
        }

        .previewBox {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 12px;
            /* padding: 10px 0px; */
        }

        .contentPanel h2 {
            margin: 0;
            font-size: 15px;
            color: #526534;
        }

        .previewBox p {
            margin: 0;
            color: #6f655a;
            font-size: 12px;
            /* line-height: 1.45; */
            font-weight: bold;
        }

        .previewBox ul {
            margin: 0;
            padding-left: 18px;
            color: #6f655a;
            font-size: 12px;
            line-height: 1.45;
        }

        .previewBox ol {
            margin: 0;
            padding-left: 18px;
            color: #6f655a;
            font-size: 12px;
            line-height: 1.45;
        }

        .previewMeta {
            font-size: 12px;
            color: #7a6e5f;
        }

        .formSection {
            border-top: 1px solid #e7dfd3;
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .fieldRow {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .fieldRow label {
            font-size: 12px;
            color: #526534;
        }

        .fieldRow select,
        .fieldRow input {
            border: 1px solid #cfd8b5;
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 11px;
            background: #fffefb;
            color: #526534;
        }

        .tagGroup {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tagChip {
            border: 1px solid #cfd8b5;
            border-radius: 999px;
            padding: 4px 8px;
            font-size: 11px;
            background: #f6f2e8;
            color: #526534;
            cursor: pointer;
            user-select: none;
        }

        .tagChip.active {
            background: #dce9c8;
            border-color: #7e965a;
        }
    </style>
</head>
<body>
    <div class="card">
        <button id="closeButton" class="closeButton" aria-label="Close">×</button>
        <h1>Recipe Saver</h1>
        <div id="contentPanel" class="contentPanel" hidden>
            <div id="previewBox" class="previewBox">
                <h2 id="previewTitle"></h2>
                <p>Ingredients</p>
                <ul id="previewIngredients"></ul>
                <p>Instructions</p>
                <ol id="previewInstructions"></ol>
                <div id="previewMeta" class="previewMeta"></div>
            </div>

            <div id="metadataForm" class="formSection">
                <h2>Recipe Review</h2>
                <div class="fieldRow">
                    <label for="triedCheckbox">Tried</label>
                    <input id="triedCheckbox" type="checkbox" />
                </div>

                <div class="fieldRow">
                    <label for="ratingSelect">Rating</label>
                    <select id="ratingSelect">
                        <option value="">Optional</option>
                        <option value="1">★</option>
                        <option value="2">★★</option>
                        <option value="3">★★★</option>
                    </select>
                </div>

                <div class="fieldRow">
                    <label>Tags</label>
                    <div class="tagGroup" id="tagGroup">
                        <button type="button" class="tagChip" data-tag="Meal Prep">Meal Prep</button>
                        <button type="button" class="tagChip" data-tag="Holiday">Holiday</button>
                        <button type="button" class="tagChip" data-tag="Sweet Treat">Sweet Treat</button>
                        <button type="button" class="tagChip" data-tag="Everyday">Everyday</button>
                    </div>
                </div>

                <div class="fieldRow">
                    <label for="cuisineInput">Notes</label>
                    <input id="cuisineInput" type="text" placeholder="e.g. substitutions" />
                </div>
            </div>
        </div>
        
        <div id="statusMessage" class="status" aria-live="polite">Ready</div>
        <button id="saveButton">Preview Recipe</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
