<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recipe Saver</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 500px;
            border: none;
        }

        .card {
            background: #f4f2ef;
            border: none;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .closeButton {
            position: absolute;
            top: 8px;
            right: 8px;
            border: none;
            background: transparent;
            color: #3e5a14;
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
            padding: 2px 6px;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #526534;
        }

        p {
            margin: 0;
            font-size: 13px;
            line-height: 1.45;
            color: #6f655a;
        }

        button {
            border: 1px solid #7e965a;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #526534;
            cursor: pointer;
            background: #dce9c8;
            transition: background 0.16s ease, transform 0.16s ease;
        }

        button:hover {
            background: #c8d8b0;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.7;
            cursor: progress;
        }

        .status {
            min-height: 18px;
            font-size: 13px;
            color: #52761b;
        }

        .accountPanel {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            padding: 14px;
            border: 1px solid #dfe4dc;
            border-radius: 12px;
            background: #fff;
        }
        .accountPanel label { font-size: 12px; color: #526534; font-weight: 600; }
        .accountPanel input, .accountPanel select { min-height: 36px; border: 1px solid #d4dbd4; border-radius: 8px; padding: 7px 9px; color: #334137; font: inherit; font-size: 12px; background: #fff; }
        .accountPanel button { padding: 8px 10px; font-size: 12px; }
        .addAccountButton { border: 0; padding: 2px 0 !important; background: transparent; color: #42654a; text-align: left; }
        .addAccountButton:hover { background: transparent; text-decoration: underline; }
        .newAccountFields { display: flex; flex-direction: column; gap: 10px; }
        .newAccountFields[hidden] { display: none; }
        .accountHint { color: #6f655a; font-size: 11px; }
        .activeAccount { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .activeAccount[hidden] { display: none; }
        .activeAccount strong { color: #334137; font-size: 13px; }
        .changeAccountButton { border: 1px solid #d4dbd4 !important; padding: 6px 8px !important; background: #fff !important; color: #536157 !important; }
        .changeAccountButton:hover { background: #f0f3ee !important; }
        .accountChooser[hidden] { display: none; }

        .contentPanel {
            border-top: 1px solid #e7dfd3;
            /* display: flex; */
            flex-direction: column;
            gap: 8px;
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
        }

        .previewBox {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 12px;
            /* padding: 10px 0px; */
        }

        .contentPanel h2 {
            margin: 0;
            font-size: 15px;
            color: #526534;
        }

        .previewBox p {
            margin: 0;
            color: #6f655a;
            font-size: 12px;
            /* line-height: 1.45; */
            font-weight: bold;
        }

        .previewBox ul {
            margin: 0;
            padding-left: 18px;
            color: #6f655a;
            font-size: 12px;
            line-height: 1.45;
        }

        .ingredientName {
            color: #669220;
        }

        .previewBox ol {
            margin: 0;
            padding-left: 18px;
            color: #6f655a;
            font-size: 12px;
            line-height: 1.45;
        }

        .previewMeta {
            font-size: 12px;
            color: #7a6e5f;
        }

        .formSection {
            border-top: 1px solid #e7dfd3;
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .fieldRow {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .fieldRow label {
            font-size: 12px;
            color: #526534;
        }

        .fieldRow select,
        .fieldRow input {
            border: 1px solid #cfd8b5;
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 11px;
            background: #fffefb;
            color: #526534;
        }

        .tagGroup {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tagChip {
            border: 1px solid #cfd8b5;
            border-radius: 999px;
            padding: 4px 8px;
            font-size: 11px;
            background: #f6f2e8;
            color: #526534;
            cursor: pointer;
            user-select: none;
        }

        .tagChip.active {
            background: #dce9c8;
            border-color: #7e965a;
        }
    </style>
</head>
<body>
    <div class="card">
        <button id="closeButton" class="closeButton" aria-label="Close">×</button>
        <h1>Recipe Saver</h1>
        <form id="accountForm" class="accountPanel">
            <div id="activeAccount" class="activeAccount" hidden>
                <strong id="activeAccountName"></strong>
                <button id="changeAccountButton" class="changeAccountButton" type="button">Change account</button>
            </div>
            <div id="accountChooser" class="accountChooser">
                <label for="accountSelect">Existing accounts</label>
                <select id="accountSelect"><option value="">Choose account</option></select>
                <button id="addAccountButton" class="addAccountButton" type="button">Add a new username</button>
                <div id="newAccountFields" class="newAccountFields" hidden>
                    <label for="usernameInput">New username</label>
                    <input id="usernameInput" type="text" maxlength="50" placeholder="Enter a username" autocomplete="username" disabled />
                    <button type="submit">Continue</button>
                </div>
                <span id="accountHint" class="accountHint">Choose an account before saving.</span>
            </div>
        </form>
        <div id="contentPanel" class="contentPanel" hidden>
            <div id="previewBox" class="previewBox">
                <h2 id="previewTitle"></h2>
                <p>Ingredients</p>
                <ul id="previewIngredients"></ul>
                <p>Instructions</p>
                <ol id="previewInstructions"></ol>
                <div id="previewMeta" class="previewMeta"></div>
            </div>

            <div id="metadataForm" class="formSection">
                <h2>Recipe Review</h2>
                <div class="fieldRow">
                    <label for="triedCheckbox">Tried</label>
                    <input id="triedCheckbox" type="checkbox" />
                </div>

                <div class="fieldRow">
                    <label for="ratingSelect">Rating</label>
                    <select id="ratingSelect">
                        <option value="">Optional</option>
                        <option value="1">★</option>
                        <option value="2">★★</option>
                        <option value="3">★★★</option>
                    </select>
                </div>

                <div class="fieldRow">
                    <label>Tags</label>
                    <div class="tagGroup" id="tagGroup">
                        <button type="button" class="tagChip" data-tag="Meal Prep">Meal Prep</button>
                        <button type="button" class="tagChip" data-tag="Holiday">Holiday</button>
                        <button type="button" class="tagChip" data-tag="Sweet Treat">Sweet Treat</button>
                        <button type="button" class="tagChip" data-tag="Everyday">Everyday</button>
                    </div>
                </div>

                <div class="fieldRow">
                    <label for="notesInput">Notes</label>
                    <input id="notesInput" type="text" placeholder="e.g. substitutions" />
                </div>
            </div>
        </div>
        
        <div id="statusMessage" class="status" aria-live="polite">Ready</div>
        <button id="saveButton">Preview Recipe</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
