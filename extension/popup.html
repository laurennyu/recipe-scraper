<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recipe Saver</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 500px;
            border: none;
        }

        .card {
            background: #fcfaf7;
            border: none;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .closeButton {
            position: absolute;
            top: 8px;
            right: 8px;
            border: none;
            background: transparent;
            color: #3e5a14;
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
            padding: 2px 6px;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #526534;
        }

        p {
            margin: 0;
            font-size: 13px;
            line-height: 1.45;
            color: #6f655a;
        }

        button {
            border: 1px solid #7e965a;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #526534;
            cursor: pointer;
            background: #dce9c8;
            transition: background 0.16s ease, transform 0.16s ease;
        }

        button:hover {
            background: #c8d8b0;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.7;
            cursor: progress;
        }

        .status {
            min-height: 18px;
            font-size: 13px;
            color: #52761b;
        }

        .previewBox {
            border-top: 1px solid #e7dfd3;
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .previewBox h2 {
            margin: 0;
            font-size: 15px;
            color: #526534;
        }

        .previewBox ul {
            margin: 0;
            padding-left: 18px;
            color: #6f655a;
            font-size: 12px;
            line-height: 1.45;
        }

        .previewBox ol {
            margin: 0;
            padding-left: 18px;
            color: #6f655a;
            font-size: 12px;
            line-height: 1.45;
        }

        .previewMeta {
            font-size: 12px;
            color: #7a6e5f;
        }
    </style>
</head>
<body>
    <div class="card">
        <button id="closeButton" class="closeButton" aria-label="Close">×</button>
        <h1>Recipe Saver</h1>
        <!-- <p>Save the current page as a recipe file.</p> -->
        <div id="previewBox" class="previewBox" hidden>
            <h2 id="previewTitle">Save the current page as a recipe file</h2>
            <ul id="previewIngredients"></ul>
            <ol id="previewInstructions"></ol>
            <div id="previewMeta" class="previewMeta"></div>
        </div>
        
        <div id="statusMessage" class="status" aria-live="polite">Ready</div>
        <button id="saveButton">Preview Recipe</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
